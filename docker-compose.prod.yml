version: '3.8'

services:
  fastapi:
    image: ghcr.io/onenoly1010/pi-forge-quantum-genesis-fastapi:latest
    container_name: forge-fastapi
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - forge-network

  flask:
    image: ghcr.io/onenoly1010/pi-forge-quantum-genesis-flask:latest
    container_name: forge-flask
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=5000
      - FLASK_ENV=production
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - forge-network

  gradio:
    image: ghcr.io/onenoly1010/pi-forge-quantum-genesis-gradio:latest
    container_name: forge-gradio
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=7860
    ports:
      - "127.0.0.1:7860:7860"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      flask:
        condition: service_healthy
    networks:
      - forge-network

  nginx:
    image: nginx:1.25-alpine
    container_name: forge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/ssl/private:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - fastapi
      - flask
      - gradio
    networks:
      - forge-network

networks:
  forge-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
