name: Production CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/production.yml'
      - 'docker-compose.prod.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'production'
        type: choice
        options:
        - staging
        - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt -r server/requirements-flask.txt -r server/requirements-gradio.txt
          pip install ruff mypy pytest bandit
          
      - name: Lint with ruff
        run: ruff check server/ --fix
          
      - name: Type check
        run: mypy server/ --ignore-missing-imports
          
      - name: Security scan
        run: bandit -r server/ -ll
        
      - name: Run tests
        run: |
          cd server
          python -m pytest tests/ -v

  build-push:
    name: Build and Push Containers
    needs: lint-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.environment == 'production'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-fastapi
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-flask
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-gradio
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            
      - name: Build and push FastAPI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile.fastapi
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-fastapi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Build and push Flask
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile.flask
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-flask:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Build and push Gradio
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile.gradio
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-gradio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            #!/bin/bash
            set -e
            
            echo "🚀 Deploying Pi Forge Quantum Genesis..."
            
            # Create directory structure
            mkdir -p /opt/pi-forge/{config,logs,backups,nginx}
            cd /opt/pi-forge
            
            # Pull latest images
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-fastapi:${{ github.sha }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-flask:${{ github.sha }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-gradio:${{ github.sha }}
            
            # Tag as latest for docker-compose
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-fastapi:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-fastapi:latest
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-flask:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-flask:latest
            docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-gradio:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-gradio:latest
            
            # Update docker-compose
            curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.prod.yml -o docker-compose.prod.yml
            curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/nginx/nginx.conf -o nginx/nginx.conf
            
            # Create .env if not exists
            if [ ! -f .env ]; then
              echo "# Production environment" > .env
              echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
              echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
              echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env
            fi
            
            # Stop, pull, and restart
            docker-compose -f docker-compose.prod.yml down --remove-orphans
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Clean up old images
            docker system prune -f --filter "until=48h"
            
            # Log deployment
            echo "$(date): Deployed ${{ github.sha }}" >> logs/deployments.log
            
            echo "✅ Deployment complete!"
            
      - name: Verify deployment
        run: |
          sleep 30  # Wait for services to start
          curl -f https://${{ secrets.PROD_DOMAIN }}/health || exit 1
          echo "🎉 All services healthy!"
